<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rome Amiri</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:#111;
  color:white;
  overflow:hidden;
}

/* ---------------- GATE ---------------- */

.gate{
  position:fixed;
  inset:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:999;
  transition:opacity 1.5s ease;
}

.gate.hide-gate{
  opacity:0;
  pointer-events:none;
}

/* SLIDESHOW */

.slideshow{
  position:absolute;
  inset:0;
  z-index:-2;
}

.slideshow img{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity 2s ease-in-out, transform 15s ease;
  transform:scale(1);
}

.slideshow img.active{
  opacity:1;
  transform:scale(1.05);
}

/* DARK OVERLAY */

.gate::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.45);
  z-index:-1;
}

/* TOP TITLE */

.gate h1{
  position:absolute;
  top:40px;
  left:50%;
  transform:translateX(-50%);
  font-size:2rem;
  letter-spacing:8px;
  text-transform:uppercase;
  font-weight:300;
}

/* ENTER BUTTON */

.gate button{
  background:transparent;
  border:1px solid rgba(255,255,255,0.5);
  color:white;
  padding:14px 35px;
  cursor:pointer;
  font-size:.9rem;
  letter-spacing:3px;
  text-transform:uppercase;
  transition:.3s ease;
}

.gate button:hover{
  background:white;
  color:black;
}

/* ---------------- MAIN SITE ---------------- */

.site{
  display:flex;
  width:100%;
  height:100vh;
  opacity:0;
  transition:opacity 1.5s ease;
}

.site.show-site{
  opacity:1;
}

/* SIDEBAR */

.sidebar{
  width:220px;
  padding:50px 30px;
  border-right:1px solid rgba(255,255,255,0.08);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.logo{
  font-size:1rem;
  letter-spacing:4px;
  text-transform:uppercase;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.nav a{
  color:white;
  text-decoration:none;
  font-size:.95rem;
  letter-spacing:2px;
  opacity:.65;
  transition:.3s ease;
}

.nav a:hover{
  opacity:1;
}

/* CONTENT */

.content{
  flex:1;
  padding:60px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.hero-image{
  width:80%;
  height:80%;
  background:url('images/main-image.jpg') center center / cover no-repeat;
}
</style>
</head>
<body>

<!-- GATE PAGE -->

<div class="gate" id="gate">

  <div class="slideshow">
    <img src="images/gate1.jpg" class="active">
    <img src="images/gate2.jpg">
    <img src="images/gate3.jpg">
    <img src="images/gate4.jpg">
  </div>

  <h1>ROME AMIRI</h1>

  <button id="enterBtn">ENTER</button>

</div>

<!-- MAIN WEBSITE -->

<div class="site" id="site">

  <div class="sidebar">
    <div class="logo">ROME AMIRI</div>

    <div class="nav">
      <a href="#">Work</a>
      <a href="#">About</a>
      <a href="#">Archive</a>
      <a href="#">Contact</a>
    </div>
  </div>

  <div class="content">
    <div class="hero-image"></div>
  </div>

</div>

<script>
/* SLIDESHOW */

const slides = document.querySelectorAll(".slideshow img");
let current = 0;

setInterval(() => {
  slides[current].classList.remove("active");
  current = (current + 1) % slides.length;
  slides[current].classList.add("active");
}, 15000);

/* ENTER BUTTON TRANSITION */

const enterBtn = document.getElementById("enterBtn");
const gate = document.getElementById("gate");
const site = document.getElementById("site");

enterBtn.addEventListener("click", function(){
  gate.classList.add("hide-gate");
  site.classList.add("show-site");

  document.body.style.overflow = "auto";
});
</script>

</body>
</html>
