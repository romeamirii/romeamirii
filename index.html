<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rome Amiri</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family: Arial, Helvetica, sans-serif;
  background:#fff;
  color:#111;
  overflow:hidden;
}

/* GATE */

.gate{
  position:fixed;
  inset:0;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  z-index:999;
  transition:opacity 1.5s ease;
}

.gate.hide-gate{
  opacity:0;
  pointer-events:none;
}

.slideshow{
  position:absolute;
  inset:0;
  z-index:-2;
}

.slideshow img{
  position:absolute;
  width:100%;
  height:100%;
  object-fit:cover;
  opacity:0;
  transition:opacity 2s ease-in-out, transform 15s ease;
  transform:scale(1);
}

.slideshow img.active{
  opacity:1;
  transform:scale(1.05);
}

.gate::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.45);
  z-index:-1;
}

.gate h1{
  position:absolute;
  top:40px;
  left:50%;
  transform:translateX(-50%);
  font-size:2rem;
  letter-spacing:8px;
  color:white;
  font-weight:300;
}

.gate button{
  background:transparent;
  border:1px solid rgba(255,255,255,0.6);
  color:white;
  padding:14px 35px;
  cursor:pointer;
  letter-spacing:3px;
}

.gate button:hover{
  background:white;
  color:black;
}

/* MAIN SITE */

.site{
  display:flex;
  min-height:100vh;
  opacity:0;
  transition:opacity 1.5s ease;
}

.site.show-site{
  opacity:1;
}

/* SIDEBAR */

.sidebar{
  width:260px;
  min-height:100vh;
  padding:55px 45px;
  position:fixed;
  left:0;
  top:0;
  background:#fff;
}

.logo{
  font-size:2.2rem;
  font-weight:900;
  letter-spacing:-2px;
  margin-bottom:5px;
}

.subtitle{
  font-size:.75rem;
  color:#999;
  margin-bottom:45px;
}

.nav-title{
  color:#999;
  margin-bottom:12px;
}

.nav{
  display:flex;
  flex-direction:column;
  gap:14px;
  margin-bottom:35px;
}

.nav a{
  color:#111;
  text-decoration:none;
  font-size:1rem;
  font-weight:600;
}

.small-links{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-bottom:30px;
}

.small-links a{
  color:#111;
  text-decoration:none;
  font-size:.9rem;
}

.socials{
  display:flex;
  gap:15px;
  font-size:1.4rem;
}

/* GRID */

.gallery{
  margin-left:260px;
  padding:45px 45px 45px 20px;
  width:calc(100% - 260px);
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:10px;
}

.gallery img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.tall{
  height:620px;
}

.medium{
  height:420px;
}

.short{
  height:250px;
}

/* MOBILE */

@media(max-width:900px){
  .sidebar{
    position:relative;
    width:100%;
    min-height:auto;
  }

  .site{
    flex-direction:column;
  }

  .gallery{
    margin-left:0;
    width:100%;
    grid-template-columns:1fr;
    padding:20px;
  }
}
</style>
</head>

<body>

<!-- GATE -->

<div class="gate" id="gate">
  <div class="slideshow">
    <img src="images/gate1.jpg" class="active">
    <img src="images/gate2.jpg">
    <img src="images/gate3.jpg">
    <img src="images/gate4.jpg">
  </div>

  <h1>ROME AMIRI</h1>
  <button id="enterBtn">ENTER</button>
</div>

<!-- MAIN WEBSITE -->

<div class="site" id="site">

  <aside class="sidebar">
    <div class="logo">rome amiri</div>
    <div class="subtitle">photography / videography</div>

    <div class="nav-title">recent.</div>

    <nav class="nav">
      <a href="#">outdoor.</a>
      <a href="#">cities.</a>
      <a href="#">lifestyle.</a>
      <a href="#">sneaker.</a>
      <a href="#">reels&loops.</a>
    </nav>

    <div class="small-links">
      <a href="#">about.</a>
      <a href="#">imprint</a>
    </div>

    <div class="socials">
      <span>f</span>
      <span>◎</span>
    </div>
  </aside>

  <main class="gallery">
    <img src="images/photo1.jpg" class="tall">
    <img src="images/photo2.jpg" class="medium">
    <img src="images/photo3.jpg" class="short">

    <img src="images/photo4.jpg" class="medium">
    <img src="images/photo5.jpg" class="short">
    <img src="images/photo6.jpg" class="tall">

    <img src="images/photo7.jpg" class="medium">
    <img src="images/photo8.jpg" class="tall">
    <img src="images/photo9.jpg" class="medium">
  </main>

</div>

<script>
const slides = document.querySelectorAll(".slideshow img");
let current = 0;

setInterval(() => {
  slides[current].classList.remove("active");
  current = (current + 1) % slides.length;
  slides[current].classList.add("active");
}, 15000);

const enterBtn = document.getElementById("enterBtn");
const gate = document.getElementById("gate");
const site = document.getElementById("site");

enterBtn.addEventListener("click", function(){
  gate.classList.add("hide-gate");
  site.classList.add("show-site");
  document.body.style.overflow = "auto";
});
</script>

</body>
</html>
