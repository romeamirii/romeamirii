<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rome Amiri</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, Helvetica, sans-serif;
  background:#fff;
  color:#111;
  overflow:hidden;
}

/* GATE */
.gate{
  position:fixed;
  inset:0;
  background:#000;
  color:#fff;
  z-index:999;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:opacity 1.2s ease;
}

.gate.hide{
  opacity:0;
  pointer-events:none;
}

.gate-logo{
  position:absolute;
  top:45px;
  left:50%;
  transform:translateX(-50%);
  font-size:1.8rem;
  letter-spacing:7px;
  font-weight:400;
  text-transform:uppercase;
}

.enter{
  background:transparent;
  border:1px solid rgba(255,255,255,.7);
  color:#fff;
  padding:14px 38px;
  letter-spacing:3px;
  font-size:.8rem;
  cursor:pointer;
  text-transform:uppercase;
}

.enter:hover{
  background:#fff;
  color:#000;
}

/* SITE */
.site{
  opacity:0;
  transition:opacity 1.2s ease;
}

.site.show{
  opacity:1;
}

.sidebar{
  position:fixed;
  left:0;
  top:0;
  width:260px;
  height:100vh;
  background:#fff;
  padding:55px 38px;
}

.logo{
  font-size:2.4rem;
  font-weight:900;
  letter-spacing:-2px;
  line-height:1;
}

.tagline{
  font-size:.75rem;
  color:#999;
  margin-top:10px;
  margin-bottom:45px;
}

.menu-title{
  color:#aaa;
  margin-bottom:15px;
  font-size:.95rem;
}

nav{
  display:flex;
  flex-direction:column;
  gap:14px;
  margin-bottom:38px;
}

nav a{
  color:#111;
  text-decoration:none;
  font-size:1rem;
  font-weight:700;
}

.extra-links{
  display:flex;
  flex-direction:column;
  gap:12px;
  margin-bottom:35px;
}

.extra-links a{
  color:#111;
  text-decoration:none;
  font-size:.85rem;
}

.socials{
  display:flex;
  gap:16px;
  font-size:1.4rem;
}

/* GALLERY */
.gallery{
  margin-left:260px;
  padding:45px 40px 45px 20px;
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  gap:10px;
  align-items:start;
}

.column{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.photo{
  width:100%;
  object-fit:cover;
  display:block;
}

.tall{ height:620px; }
.medium{ height:430px; }
.short{ height:260px; }

@media(max-width:900px){
  body{
    overflow:auto;
  }

  .sidebar{
    position:relative;
    width:100%;
    height:auto;
  }

  .gallery{
    margin-left:0;
    grid-template-columns:1fr;
    padding:20px;
  }
}
</style>
</head>

<body>

<!-- GATE -->
<section class="gate" id="gate">
  <div class="gate-logo">ROME AMIRI</div>
  <button class="enter" id="enterBtn">Enter Website</button>
</section>

<!-- WEBSITE -->
<section class="site" id="site">

  <aside class="sidebar">
    <div class="logo">rome<br>amiri</div>
    <div class="tagline">photography / videography</div>

    <div class="menu-title">recent.</div>

    <nav>
      <a href="#">outdoor.</a>
      <a href="#">cities.</a>
      <a href="#">lifestyle.</a>
      <a href="#">sneaker.</a>
      <a href="#">reels&loops.</a>
    </nav>

    <div class="extra-links">
      <a href="#">about.</a>
      <a href="#">imprint</a>
    </div>

    <div class="socials">
      <span>f</span>
      <span>◎</span>
    </div>
  </aside>


</section>

<script>
const enterBtn = document.getElementById("enterBtn");
const gate = document.getElementById("gate");
const site = document.getElementById("site");

enterBtn.addEventListener("click", () => {
  gate.classList.add("hide");
  site.classList.add("show");
  document.body.style.overflow = "auto";
});
</script>

</body>
</html>
