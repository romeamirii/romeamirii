<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rome Amiri</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, Helvetica, sans-serif;
      background:#f4f4f4;
      color:#111;
      overflow:hidden;
    }

    /* GATE */

    .gate{
      position:fixed;
      inset:0;
      background:#050505;
      color:white;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      z-index:999;
      transition:1s ease;
    }

    .gate h1{
      font-size:3rem;
      letter-spacing:8px;
      text-transform:uppercase;
      margin-bottom:35px;
      font-weight:400;
    }

    .gate button{
      background:transparent;
      color:white;
      border:1px solid rgba(255,255,255,.45);
      padding:14px 34px;
      letter-spacing:3px;
      text-transform:uppercase;
      cursor:pointer;
      transition:.3s ease;
    }

    .gate button:hover{
      background:white;
      color:black;
    }

    .gate.hide{
      opacity:0;
      pointer-events:none;
    }

    /* MAIN PAGE */

    .site{
      opacity:0;
      transition:1s ease;
      min-height:100vh;
      display:flex;
    }

    .site.show{
      opacity:1;
    }

    .sidebar{
      width:260px;
      height:100vh;
      padding:55px 35px;
      background:#f4f4f4;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .brand h2{
      font-size:3.2rem;
      line-height:.78;
      letter-spacing:-4px;
      text-transform:lowercase;
      margin-bottom:12px;
    }

    .brand p{
      font-size:.75rem;
      color:#999;
      font-weight:bold;
    }

    .tabs{
      margin-top:45px;
      display:flex;
      flex-direction:column;
      gap:15px;
    }

    .tabs a{
      text-decoration:none;
      font-size:1rem;
      font-weight:bold;
      color:#999;
      transition:.25s ease;
    }

    .tabs a.active,
    .tabs a:hover{
      color:#111;
    }

    .bottom-links{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .bottom-links a{
      text-decoration:none;
      font-size:.9rem;
      font-weight:bold;
      color:#222;
    }

    .content{
      flex:1;
      min-height:100vh;
      background:white;
      padding:55px;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#ccc;
      font-size:1rem;
      letter-spacing:2px;
      text-transform:uppercase;
    }

    @media(max-width:800px){
      .site{
        flex-direction:column;
      }

      .sidebar{
        width:100%;
        height:auto;
        gap:40px;
      }

      .content{
        min-height:60vh;
      }
    }
  </style>
</head>

<body>

  <div class="gate" id="gate">
    <h1>Rome Amiri</h1>
    <button onclick="enterSite()">Enter Website</button>
  </div>

  <main class="site" id="site">

    <aside class="sidebar">

      <div>
        <div class="brand">
          <h2>rome<br>amiri</h2>
          <p>film / photography</p>
        </div>

        <nav class="tabs">
          <a href="#" class="active">recent.</a>
          <a href="#">films.</a>
          <a href="#">photos.</a>
          <a href="#">archive.</a>
          <a href="#">visuals.</a>
        </nav>
      </div>

      <div class="bottom-links">
        <a href="#">about.</a>
        <a href="#">contact.</a>
      </div>

    </aside>

    <section class="content">
      content area
    </section>

  </main>

  <script>
    function enterSite(){
      document.getElementById("gate").classList.add("hide");
      document.getElementById("site").classList.add("show");
      document.body.style.overflow = "auto";
    }
  </script>

</body>
</html>
